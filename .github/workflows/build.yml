name: build

# Every push to "redesign" or "frontend-v2": check, then build linux/amd64 images and push to
# GitHub Container Registry, tagged with the short git SHA. No Docker needed
# on anyone's laptop. Uses the built-in GITHUB_TOKEN only.
on:
  push:
    branches: [redesign, frontend-v2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Hello image (pipeline smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: hello
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:hello-${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hello: \`${IMAGE}:hello-${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
