<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SecondShelf</title>
    <meta name="description" content="Sell packaged food before it expires." />
    <meta name="theme-color" content="#0B3B2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SecondShelf" />
    <meta property="og:title" content="SecondShelf" />
    <meta property="og:description" content="Sell it before it expires." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint; system font shows until Poppins swaps in. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    </noscript>
    <!-- Sign-in photo: the first large paint on a fresh device. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/opt/secondshelf_market_woman_1794091354727-640.webp 640w, /images/opt/secondshelf_market_woman_1794091354727-960.webp 960w, /images/opt/secondshelf_market_woman_1794091354727-1280.webp 1280w"
      imagesizes="(min-width: 1024px) 50vw, 100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
